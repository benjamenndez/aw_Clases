<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sisifo</title>
</head>
<body>
    <header>
        <a href="./index.html" aria-label="ir al inicio">
          <img src="./recursos/imagenes/pesa.png" alt="logo pesa">
        </a>
        <nav>
            <a href="./index.html">
                Inicio
            </a>
            <a href="./contacto.html">
                Contacto
            </a>
        </nav>
    </header>
    
    <main>
        <h1>contacto</h1>
        <form action="./contacto.html" method="post">
            <!--  
            nombre
            telefono
            tamaño
            edad
            comentario / sobre la mascota
            -->
            <label for="id-Nombre">Nombre</label>
            <input type="text" name="nombre" id="id-Nombre">

            <label for="id-Telefono">Telefono</label>
            <input type="tel" name="telefono" id="id-Telefono">

            <label for="id-TamañoMascota">Tamaño de mascota</label>
            <select name="tamaño-mascota" id="id-TamañoMascota">
                <option value="C">Chico</option>
                <option value="M">Mediano</option>
                <option value="G">Grande</option>
            </select>
            
            <label for="id-Edad">Edad</label>
            <input type="number" name="edad" id="id-Edad">

            <label for="id-Comentario">Comentario/comportamiento</label>
            <textarea name="comentario" id="id-Comentario"></textarea>

            <!--  -->
            <!-- <input type="button" value="Enviar"> -->
             <button type="reset">
                Borrar
            </button>
            <button type="submit">
                Enviar
            </button>
        </form>

    </main>
    
    <footer>
      <ul>
        <li>
            <a href="https://instagram.com/sisifogym" target="_blank">
                @sisifogym
            </a>
        </li>
        <li>
            Bv. San Juan 200 - Bº Nueva Cordoba
        </li>
      </ul>
    
    </footer>
</body>
</html>
