<!-- Tipo de documento en html  -->
<!DOCTYPE html>
<!-- el idioma -->
<html lang="es">
<!-- no se renderiza pero da informacion -->
<head>
    <!-- le dice al navegador cuantos caracteres vamos a utilizar -->
    <meta charset="UTF-8">
    <!-- meta mete informacion en el viewport  -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- titulo que aparece en el navegador -->
    <title>SisifoGym</title>
</head>
<!-- todo lo que se va a renderizar en el viewport -->
<body>
    <h1>Somos Sisifo</h1>
  <h2>Tu gimnasio de confianza</h2>
  <p>
    el mejor de la Ciudad de cordoba
  </p>
</body>
</html>
